launcher:
  type: slurm
  cpus_per_simulation: 4
  simulations_per_gpu: 1
  gpu_resource: gpu:a100_80g:1

smartsim:
  interface: lo

scheduler:
  submit_command: sbatch
  time: 2-00:00:00
  job_name: mcc-train

runtime:
  startup_timeout: 1200

# Do not commit usernames or site-private paths. Copy this file to a `.local.yaml`
# profile and provide cluster-specific account, partition, routable interface,
# modules, cache locations, and storage paths there. The loopback interface is
# valid only for a one-node run.
