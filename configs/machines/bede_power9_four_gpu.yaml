launcher:
  # The batch allocation owns one POWER9 node and all four local V100s.
  type: local
  cpus_per_simulation: 4
  simulations_per_gpu: 1
  gpu_resource: gpu:1

smartsim:
  interface: lo
  # Fallback when the per-allocation SMARTSIM_PORT override is unavailable.
  port: 16780

runtime:
  startup_timeout: 1200
