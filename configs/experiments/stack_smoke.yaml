schema_version: 1

run:
  name: bede_stack_smoke

case:
  name: toroidal_gr1e9_ha1750
  executable: cases/toroidal_gr1e9_ha1750/run_case.sh

data:
  snapshots: data/snapshots

reward:
  type: first_wall_ewma
  reference_flux: 0.0166913
  ewma_timescale: 10.0
  scale: 1.0
  action_magnitude_regularization: 0.0
  action_slew_regularization: 0.0

# One rollout contains two physical CFD transitions and twenty virtual-agent
# samples. Completing it proves that data exchange and an optimizer update work.
ppo:
  rollout_steps: 2
  batch_size: 20
  epochs: 1
  learning_rate: 1.0e-4

training:
  # Keep the simulator alive for the whole smoke run; no restart is necessary.
  episode_steps: 8
  total_timesteps: 20
  checkpoint_interval: 1000
  metrics_interval: 10
