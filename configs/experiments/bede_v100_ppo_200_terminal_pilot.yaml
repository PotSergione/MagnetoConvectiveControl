schema_version: 1

# Diagnostic pilot: identical to the 200-step Bede run except that the
# physical horizon is a true terminal boundary. PPO must not bootstrap a
# continuation value because the next episode restarts from another snapshot.
run:
  name: bede_v100_ppo_200_terminal_pilot
  artifact_root: /nobackup/projects/bdman39/sergione/training

case:
  name: toroidal_gr1e9_ha1750
  executable: cases/toroidal_gr1e9_ha1750/run_case.sh

data:
  snapshots: /nobackup/projects/bdman39/sergione/data/snapshots

reward:
  type: first_wall_ewma
  reference_flux: 0.0166913
  ewma_timescale: 10.0
  scale: 1.0
  action_magnitude_regularization: 0.0
  action_slew_regularization: 0.0

ppo:
  rollout_steps: 200
  batch_size: 1000
  epochs: 5
  learning_rate: 1.0e-4

training:
  episode_steps: 200
  episode_horizon_truncated: false
  total_timesteps: 80000
  checkpoint_interval: 25000
  metrics_interval: 2500
