schema_version: 1

run:
  name: bede_two_gpu_stack_smoke

case:
  name: toroidal_gr1e9_ha1750
  executable: cases/toroidal_gr1e9_ha1750/run_case.sh

data:
  snapshots: data/snapshots

reward:
  type: first_wall_ewma
  reference_flux: 0.0166913
  ewma_timescale: 10.0
  scale: 1.0
  action_magnitude_regularization: 0.0
  action_slew_regularization: 0.0

# Two physical environments each contribute ten virtual-agent samples at each
# of two rollout steps: 2 environments * 10 agents * 2 steps = 40 samples.
ppo:
  rollout_steps: 2
  batch_size: 40
  epochs: 1
  learning_rate: 1.0e-4

training:
  episode_steps: 8
  total_timesteps: 40
  checkpoint_interval: 1000
  metrics_interval: 20
