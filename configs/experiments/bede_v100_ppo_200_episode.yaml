schema_version: 1

# Four-environment Bede counterpart of first_wall_ppo_nsteps1000.yaml.
# Use 250 steps per environment so each PPO rollout still contains 10,000
# virtual-agent samples: 4 environments * 250 steps * 10 virtual agents.
run:
  name: bede_v100_ppo_200_episode_nsteps250
  artifact_root: /nobackup/projects/bdman39/sergione/training

case:
  name: toroidal_gr1e9_ha1750
  executable: cases/toroidal_gr1e9_ha1750/run_case.sh

data:
  snapshots: /nobackup/projects/bdman39/sergione/data/snapshots

reward:
  type: first_wall_ewma
  reference_flux: 0.0166913
  ewma_timescale: 10.0
  scale: 1.0
  action_magnitude_regularization: 0.0
  action_slew_regularization: 0.0

ppo:
  rollout_steps: 250
  batch_size: 1000
  epochs: 5
  learning_rate: 1.0e-4

training:
  episode_steps: 200
  total_timesteps: 300000
  checkpoint_interval: 25000
  metrics_interval: 2500
