schema_version: 1

run:
  name: first_wall_ppo
  artifact_root: runs

case:
  name: toroidal_gr1e9_ha1750
  executable: cases/toroidal_gr1e9_ha1750/run_case.sh

data:
  snapshots: data/snapshots

reward:
  type: first_wall_ewma
  reference_flux: 0.0166913
  ewma_timescale: 10.0
  scale: 1.0
  action_magnitude_regularization: 0.0
  action_slew_regularization: 0.0

ppo:
  rollout_steps: 256
  batch_size: 256
  epochs: 5
  learning_rate: 1.0e-4

training:
  episode_steps: 1000
  total_timesteps: 300000
  checkpoint_interval: 25000
  metrics_interval: 2560
